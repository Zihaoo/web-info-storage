name: Sync IP and brand news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
concurrency:
  group: ip-brand-news
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_ip_brand.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ip-brand-news
          git diff --cached --quiet || git commit -m "Update daily IP and brand news"
          git pull --rebase origin main
          git push origin HEAD:main
